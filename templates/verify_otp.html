<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>OTP सत्यापन - स्कूल प्रबंधन पोर्टल</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card shadow p-4" style="max-width: 400px; width: 100%;">
    <h3 class="text-center mb-3">OTP सत्यापन</h3>
    <p class="text-muted text-center fs-7">आपके मोबाइल/ईमेल पर भेजा गया 6-अंकों का OTP दर्ज करें।</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} p-2 fs-7">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('verify_otp') }}" method="POST">
        <div class="mb-3">
            <label class="form-label">OTP दर्ज करें</label>
            <input type="text" name="otp" class="form-control text-center fs-4" maxlength="6" placeholder="******" required>
        </div>
        <button type="submit" class="btn btn-success w-100">सत्यापित करें और लॉगिन करें</button>
    </form>
</div>

</body>
</html>
