<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #eef2f3; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="p-3 p-md-5">

<div class="container" style="max-width: 650px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm rounded-pill">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card p-4">
        <h3 class="fw-bold text-primary mb-3"><i class="bi bi-gear-fill"></i> System & School Settings</h3>
        <hr>

        {% if msg %}
        <div class="alert alert-success alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('settings') }}">
            <div class="mb-3">
                <label class="form-label fw-semibold">School Name (स्कूल का नाम)</label>
                <input type="text" name="school_name" class="form-control" value="{{ config_data.school_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Principal Name (प्रिंसिपल का नाम)</label>
                <input type="text" name="principal_name" class="form-control" value="{{ config_data.principal_name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">School Address / Subtitle</label>
                <input type="text" name="school_address" class="form-control" value="{{ config_data.school_address }}">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Academic Session (सत्र)</label>
                <input type="text" name="academic_session" class="form-control" value="{{ config_data.academic_session }}">
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold rounded-pill shadow-sm">
                <i class="bi bi-save"></i> Save Settings
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
