<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Admission Record</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; margin: 15px; }
        .card { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .form-group { margin-bottom: 10px; }
        .full-width { grid-column: 1 / -1; }
        label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 3px; }
        input, select, textarea { width: 100%; padding: 7px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .btn { padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; background: #28a745; width: 100%; font-size: 15px; margin-top: 15px; }
        .photo-preview { width: 80px; height: 90px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <a href="/student_info" style="text-decoration:none; color:#007bff; font-weight:bold;">← Back to Master Cards</a>
        <h2>Edit Student Admission Record</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="form-grid">
                <div class="form-group"><label>Scholar No</label><input type="text" name="scholar_no" value="{{ s.scholar_no }}" required></div>
                <div class="form-group"><label>Roll No</label><input type="text" name="roll_no" value="{{ s.roll_no or '' }}"></div>
                <div class="form-group"><label>Student Name</label><input type="text" name="name" value="{{ s.name }}" required></div>
                <div class="form-group"><label>Father's Name</label><input type="text" name="father_name" value="{{ s.father_name }}" required></div>
                <div class="form-group"><label>Mother's Name</label><input type="text" name="mother_name" value="{{ s.mother_name or '' }}"></div>
                <div class="form-group"><label>Date of Birth</label><input type="date" name="dob" value="{{ s.dob }}" required></div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="Boy" {% if s.gender == 'Boy' or not s.gender %}selected{% endif %}>Boy</option>
                        <option value="Girl" {% if s.gender == 'Girl' %}selected{% endif %}>Girl</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Class</label>
                    <select name="class_name" required>
                        {% for c in ['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'] %}
                        <option value="{{ c }}" {% if s.class_name == c %}selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Group</label>
                    <select name="group_name">
                        <option value="">None</option>
                        {% for g in ['Science','Maths','Commerce','Arts'] %}
                        <option value="{{ g }}" {% if s.group_name == g %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group"><label>Admission Year</label><input type="text" name="admission_year" value="{{ s.admission_year or '2026' }}"></div>

                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="Active" {% if s.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="TC Issued" {% if s.status == 'TC Issued' %}selected{% endif %}>TC Issued</option>
                        <option value="Left" {% if s.status == 'Left' %}selected{% endif %}>Left School</option>
                    </select>
                </div>

                <div class="form-group"><label>Samagra ID</label><input type="text" name="samagra_id" value="{{ s.samagra_id or '' }}"></div>
                <div class="form-group"><label>Aadhaar ID</label><input type="text" name="aadhaar_id" value="{{ s.aadhaar_id or '' }}"></div>
                <div class="form-group"><label>APAAR ID</label><input type="text" name="apaar_id" value="{{ s.apaar_id or '' }}"></div>
                <div class="form-group"><label>PEN Number</label><input type="text" name="pen_number" value="{{ s.pen_number or '' }}"></div>
                <div class="form-group"><label>Mobile No</label><input type="text" name="mobile_no" value="{{ s.mobile_no or '' }}"></div>
                <div class="form-group"><label>Bank Account</label><input type="text" name="bank_account" value="{{ s.bank_account or '' }}"></div>
                <div class="form-group"><label>IFSC Code</label><input type="text" name="ifsc_code" value="{{ s.ifsc_code or '' }}"></div>

                <!-- Address Field Added Below -->
                <div class="form-group full-width">
                    <label>Address</label>
                    <input type="text" name="address" value="{{ s.address or '' }}">
                </div>

                <div class="form-group full-width">
                    <label>Update Student Photo</label>
                    <input type="file" name="student_photo" accept="image/*">
                    {% if s.photo_path %}
                    <img src="{{ url_for('static', filename=s.photo_path.replace('static/', '')) }}" class="photo-preview" alt="Photo">
                    {% endif %}
                </div>
            </div>

            <button type="submit" class="btn">Update Record</button>
        </form>
    </div>
</body>
</html>
